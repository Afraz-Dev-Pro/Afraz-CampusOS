name: Daily Automated Sync

on:
  schedule:
    # Runs 3 times daily at 04:00, 10:00, and 16:00 UTC
    - cron: '0 4,10,16 * * *'
  workflow_dispatch: # Lets you test it manually with one click

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp log
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" >> activity.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f activity.log
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "Automated sync: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
